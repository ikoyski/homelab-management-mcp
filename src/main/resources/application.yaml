server:
  port: ${PORT:8083}

spring:
  application:
    name: homelab-management-mcp
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8089}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:}
      password: ${CONFIG_SERVER_PASSWORD:}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:homelab}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

homelab:
  security:
    issuer: ${HOMELAB_AUTH_ISSUER:https://auth.ikoyski.top}
    jwk-set-uri: ${HOMELAB_AUTH_JWK_SET_URI:https://auth.ikoyski.top/oauth2/jwks}
    audience: ${HOMELAB_MCP_AUDIENCE:https://homelab-mcp.ikoyski.top/mcp}
  discovery:
    mode: read-only
    targets: []
