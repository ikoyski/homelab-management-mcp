server:
  port: ${PORT:8083}
  forward-headers-strategy: native

spring:
  cloud:
    config:
      enabled: false

management:
  server:
    port: ${MANAGEMENT_PORT:8082}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

homelab:
  security:
    issuer: https://auth.ikoyski.top
    jwk-set-uri: https://auth.ikoyski.top/oauth2/jwks
    audience: https://homelab-mcp.ikoyski.top/mcp
  discovery:
    mode: read-only
    targets:
      - local-development-only
