server:
  port: ${PORT:8090}

spring:
  application:
    name: homelab-management-mcp
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8089}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:}
      password: ${CONFIG_SERVER_PASSWORD:}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:homelab}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

homelab:
  discovery:
    mode: read-only
    targets: []
